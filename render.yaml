# Render Blueprint — backend web service.
# Deploy: in Render, New → Blueprint, point it at this repo. Render reads this file.
# Secrets marked `sync: false` are NOT stored in the repo — set them in the
# Render dashboard (Environment tab) after the service is created.
services:
  - type: web
    name: ascend-backend
    runtime: node
    rootDir: backend
    plan: free
    # Generate the Prisma client, compile TS, then apply pending migrations to Neon.
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL          # Neon connection string (use the direct, non-pooled URL)
        sync: false
      - key: JWT_ACCESS_SECRET     # openssl rand -hex 48
        sync: false
      - key: JWT_REFRESH_SECRET    # openssl rand -hex 48
        sync: false
      - key: EXPO_PROJECT_ID       # from https://expo.dev once you create the project
        sync: false
      - key: CORS_ORIGINS          # optional: comma-separated web origins (native apps don't need this)
        sync: false
