<!--
  Trace mark, monochrome silhouette — source for the Android notification icon.

  Android throws away every channel but alpha here and tints the result with the
  `color` set in app.json, so this is deliberately white-on-transparent with no
  background plate. The tail's fade survives as partial alpha, which is exactly
  what it should do.

  Drawn larger inside the canvas than the app icon: the system already insets
  and shrinks the status-bar glyph, so extra padding here just loses it.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="tail" x1="0.1" y1="0.95" x2="0.5" y2="0.05">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <g transform="translate(96 96) scale(2.4) translate(-36 -36)">
    <circle cx="36" cy="36" r="26" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-opacity="0.35"/>
    <path d="M10 36 A26 26 0 0 1 36 10" fill="none" stroke="url(#tail)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="36" cy="10" r="7" fill="#FFFFFF"/>
  </g>
</svg>
